name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[aaf,pdf,dev]"

      - name: Check the installed CLI
        run: conformkit --version

      - name: Run tests
        run: python -m pytest tests -q --junitxml=pytest-results.xml

      # Private production fixtures are gitignored, so tests that need them
      # skip in CI. Print how many skipped, and why, without failing the job
      # when the count is non-zero.
      - name: Report skipped tests
        if: always()
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("pytest-results.xml")
          if not report.exists():
              print("no test report produced; nothing to summarise")
              sys.exit(0)

          root = ET.parse(report).getroot()
          suites = list(root.iter("testsuite"))
          total = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          print(f"{total} tests, {skipped} skipped "
                f"(missing private fixtures are expected)")
          for case in root.iter("testcase"):
              for skipped_case in case.findall("skipped"):
                  message = (skipped_case.get("message") or "").replace("\n", " ")
                  print(f"  SKIP {case.get('classname')}::{case.get('name')}: "
                        f"{message[:160]}")
          PY
